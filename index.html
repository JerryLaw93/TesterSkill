<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>权限管理系统</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3d5af1;
    --danger: #e74c3c;
    --success: #2ecc71;
    --text: #2c3e50;
    --text-light: #7f8c9b;
    --border: #e3e8f0;
    --bg: #f0f3f9;
    --sidebar: #fff;
    --sidebar-active: #f0f4ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; }
  body { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }

  .card { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); width: 100%; max-width: 420px; padding: 40px 36px; animation: fadeUp .5s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

  h1 { font-size: 22px; color: var(--text); text-align: center; margin-bottom: 6px; }
  .subtitle { text-align: center; color: var(--text-light); font-size: 13px; margin-bottom: 28px; }

  .form-item { margin-bottom: 18px; }
  label { display: block; font-size: 13px; color: var(--text); margin-bottom: 6px; font-weight: 500; }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: border .2s, box-shadow .2s; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.15); }

  .captcha-row { display: flex; gap: 10px; align-items: center; }
  .captcha-row input { flex: 1; }
  #captchaCanvas { cursor: pointer; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; }
  .captcha-tip { font-size: 12px; color: var(--text-light); margin-top: 5px; text-align: right; }

  .btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s, transform .1s, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-ghost { background: var(--bg); color: var(--text); }
  .btn-ghost:hover { background: #e6eaf3; }
  .btn-danger { color: var(--danger); border: 1px solid #f5c6c0; background: #fdf0ef; }
  .btn-danger:hover { background: #fadbd8; }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .msg { min-height: 20px; font-size: 13px; margin-bottom: 10px; text-align: center; }
  .msg.error { color: var(--danger); }
  .msg.success { color: var(--success); }

  .default-tip { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-light); text-align: center; line-height: 1.8; }

  /* ===== 应用布局 ===== */
  #appView { display: none; width: 100%; max-width: 1200px; height: calc(100vh - 40px); background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow: hidden; animation: fadeUp .4s ease; }
  .app-layout { display: flex; height: 100%; }

  /* 侧边栏 */
  .sidebar { width: 200px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .logo { padding: 24px 20px; font-size: 18px; font-weight: 700; color: var(--primary); border-bottom: 1px solid var(--border); }
  .nav { flex: 1; padding: 12px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; cursor: pointer; color: var(--text); transition: background .2s; margin-bottom: 6px; }
  .nav-item:hover { background: #f5f7fa; }
  .nav-item.active { background: var(--sidebar-active); color: var(--primary); font-weight: 600; }
  .nav-icon { width: 20px; text-align: center; }

  /* 主内容区 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 64px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 24px; background: #fff; }
  .page-title { font-size: 18px; font-weight: 600; color: var(--text); }
  .user-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-light); }
  .content { flex: 1; padding: 24px; overflow: auto; }

  /* ===== 首页 ===== */
  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 24px; }
  .stat-card { background: #f8fafd; border-radius: 12px; padding: 22px; border: 1px solid var(--border); }
  .stat-card .label { font-size: 13px; color: var(--text-light); margin-bottom: 8px; }
  .stat-card .value { font-size: 20px; font-weight: 700; color: var(--text); }
  .welcome-banner { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border-radius: 12px; padding: 28px; margin-bottom: 24px; }
  .welcome-banner h2 { font-size: 20px; margin-bottom: 8px; }
  .welcome-banner p { opacity: .9; font-size: 14px; }

  /* ===== 用户管理 / 权限配置 表格 ===== */
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { max-width: 220px; }
  .toolbar .btn { margin-left: auto; }

  .panel { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--text-light); font-weight: 500; font-size: 13px; background: #f8fafd; }
  tr:hover td { background: #f9fbff; }
  .role-tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; }
  .role-tag.admin { background: #e8ecfd; color: var(--primary-dark); }
  .role-tag.user { background: #e6f9ef; color: #1e9e55; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-dot.on { background: var(--success); }
  .status-dot.off { background: #ccc; }
  .empty { text-align: center; color: var(--text-light); padding: 40px 0 !important; }

  /* ===== 弹窗 ===== */
  .modal-mask { position: fixed; inset: 0; background: rgba(20,30,50,.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; padding: 28px; animation: fadeUp .25s ease; }
  .modal.wide { max-width: 600px; }
  .modal h3 { font-size: 17px; margin-bottom: 20px; color: var(--text); }
  .modal .form-item { margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .modal-actions .btn { flex: 1; }

  /* ===== 权限矩阵 ===== */
  .perm-section { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .perm-section h4 { font-size: 14px; margin-bottom: 10px; color: var(--text); }
  .perm-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .perm-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); margin: 0; cursor: pointer; }
  .perm-row input[type="checkbox"] { width: auto; padding: 0; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ==================== 登录页 ==================== -->
<div class="card" id="loginView">
  <h1>系统登录</h1>
  <p class="subtitle">请输入账号、密码和验证码登录系统</p>

  <div class="msg" id="loginMsg"></div>

  <form id="loginForm" autocomplete="off">
    <div class="form-item">
      <label for="username">账号</label>
      <input type="text" id="username" placeholder="请输入账号" maxlength="20" />
    </div>
    <div class="form-item">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" maxlength="32" />
    </div>
    <div class="form-item">
      <label for="captcha">验证码</label>
      <div class="captcha-row">
        <input type="text" id="captcha" placeholder="请输入验证码" maxlength="4" autocomplete="off" />
        <canvas id="captchaCanvas" width="110" height="44" title="点击刷新验证码"></canvas>
      </div>
      <div class="captcha-tip">看不清？点击图片刷新</div>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%">登 录</button>
  </form>

  <div class="default-tip">默认账号：admin　密码：123456</div>
</div>

<!-- ==================== 应用主体 ==================== -->
<div id="appView">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="logo">权限管理系统</div>
      <nav class="nav" id="mainNav">
        <div class="nav-item active" data-page="home"><span class="nav-icon">🏠</span>首页</div>
        <div class="nav-item" data-page="userMgmt"><span class="nav-icon">👤</span>用户管理</div>
        <div class="nav-item" data-page="roleMgmt"><span class="nav-icon">🔒</span>权限配置</div>
      </nav>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="page-title" id="pageTitle">首页</div>
        <div class="user-meta">
          <span id="welcomeUser"></span>
          <span id="loginTime"></span>
          <button class="btn btn-ghost btn-sm" id="logoutBtn">退出登录</button>
        </div>
      </div>

      <div class="content">
        <!-- ===== 首页 ===== -->
        <div id="homeView">
          <div class="welcome-banner">
            <h2>欢迎回来，<span id="homeUsername">-</span></h2>
            <p>本次登录时间：<span id="homeLoginTime">-</span></p>
          </div>
          <div class="home-grid">
            <div class="stat-card">
              <div class="label">当前账号</div>
              <div class="value" id="homeAccount">-</div>
            </div>
            <div class="stat-card">
              <div class="label">当前角色</div>
              <div class="value" id="homeRole">-</div>
            </div>
            <div class="stat-card">
              <div class="label">用户总数</div>
              <div class="value" id="homeUserCount">-</div>
            </div>
            <div class="stat-card">
              <div class="label">角色总数</div>
              <div class="value" id="homeRoleCount">-</div>
            </div>
          </div>
        </div>

        <!-- ===== 用户管理 ===== -->
        <div id="userMgmtView" class="hidden">
          <div class="toolbar">
            <input type="text" id="searchInput" placeholder="搜索账号 / 姓名..." />
            <select id="roleFilter"><option value="">全部角色</option></select>
            <button class="btn btn-primary" id="addUserBtn">+ 新增用户</button>
          </div>
          <div class="panel">
            <table>
              <thead>
                <tr><th>账号</th><th>姓名</th><th>角色</th><th>状态</th><th>创建时间</th><th style="width:150px">操作</th></tr>
              </thead>
              <tbody id="userTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- ===== 权限配置 ===== -->
        <div id="roleMgmtView" class="hidden">
          <div class="toolbar">
            <input type="text" id="roleSearchInput" placeholder="搜索角色名称..." />
            <button class="btn btn-primary" id="addRoleBtn">+ 新增角色</button>
          </div>
          <div class="panel">
            <table>
              <thead>
                <tr><th>角色名称</th><th>首页</th><th>用户管理</th><th>权限配置</th><th style="width:120px">操作</th></tr>
              </thead>
              <tbody id="roleTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ==================== 用户新增/编辑弹窗 ==================== -->
<div class="modal-mask" id="userModalMask">
  <div class="modal">
    <h3 id="userModalTitle">新增用户</h3>
    <div class="msg" id="userModalMsg"></div>
    <div class="form-item">
      <label>账号 *</label>
      <input type="text" id="mUsername" placeholder="登录账号" maxlength="20" />
    </div>
    <div class="form-item">
      <label>密码 *</label>
      <input type="password" id="mPassword" placeholder="登录密码" maxlength="32" />
    </div>
    <div class="form-item">
      <label>姓名</label>
      <input type="text" id="mRealname" placeholder="真实姓名" maxlength="20" />
    </div>
    <div class="form-item">
      <label>角色</label>
      <select id="mRole"></select>
    </div>
    <div class="form-item">
      <label>状态</label>
      <select id="mStatus">
        <option value="1">启用</option>
        <option value="0">禁用</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="userModalCancel">取消</button>
      <button class="btn btn-primary" id="userModalConfirm">保存</button>
    </div>
  </div>
</div>

<!-- ==================== 角色新增/编辑弹窗 ==================== -->
<div class="modal-mask" id="roleModalMask">
  <div class="modal wide">
    <h3 id="roleModalTitle">新增角色</h3>
    <div class="msg" id="roleModalMsg"></div>
    <div class="form-item">
      <label>角色名称 *</label>
      <input type="text" id="mRoleName" placeholder="请输入角色名称" maxlength="20" />
    </div>
    <div id="permContainer"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="roleModalCancel">取消</button>
      <button class="btn btn-primary" id="roleModalConfirm">保存</button>
    </div>
  </div>
</div>

<script>
/* ================= 数据层 ================= */
const STORE_KEY = 'sys_users';
const ROLE_KEY = 'sys_roles';
const SESSION_KEY = 'sys_session';

const PAGE_DEFS = [
  { id: 'home', name: '首页', buttons: [] },
  { id: 'userMgmt', name: '用户管理', buttons: [
    { id: 'addUser', name: '新增用户' },
    { id: 'editUser', name: '编辑用户' },
    { id: 'deleteUser', name: '删除用户' }
  ]},
  { id: 'roleMgmt', name: '权限配置', buttons: [
    { id: 'addRole', name: '新增角色' },
    { id: 'editRole', name: '编辑角色' },
    { id: 'deleteRole', name: '删除角色' }
  ]}
];

function defaultRoles() {
  const perms = {};
  PAGE_DEFS.forEach(p => {
    perms[p.id] = { view: true, buttons: {} };
    p.buttons.forEach(b => perms[p.id].buttons[b.id] = true);
  });
  const userPerms = {};
  PAGE_DEFS.forEach(p => {
    userPerms[p.id] = { view: p.id === 'home', buttons: {} };
    p.buttons.forEach(b => userPerms[p.id].buttons[b.id] = false);
  });
  return [
    { id: 'admin', name: '管理员', permissions: perms, builtIn: true },
    { id: 'user', name: '普通用户', permissions: userPerms, builtIn: true }
  ];
}

function loadRoles() {
  try {
    const data = JSON.parse(localStorage.getItem(ROLE_KEY));
    if (Array.isArray(data) && data.length) return data;
  } catch (e) {}
  const roles = defaultRoles();
  localStorage.setItem(ROLE_KEY, JSON.stringify(roles));
  return roles;
}
function saveRoles(roles) { localStorage.setItem(ROLE_KEY, JSON.stringify(roles)); }

function defaultUsers() {
  return [{
    username: 'admin', password: '123456', realname: '系统管理员',
    role: 'admin', status: 1, createTime: '2026-01-01 00:00:00'
  }];
}
function loadUsers() {
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY));
    if (Array.isArray(data) && data.length) return data;
  } catch (e) {}
  const users = defaultUsers();
  localStorage.setItem(STORE_KEY, JSON.stringify(users));
  return users;
}
function saveUsers(users) { localStorage.setItem(STORE_KEY, JSON.stringify(users)); }
function fmtTime() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

/* ================= 验证码 ================= */
const canvas = document.getElementById('captchaCanvas');
const ctx = canvas.getContext('2d');
let captchaCode = '';

function refreshCaptcha() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  captchaCode = '';
  for (let i = 0; i < 4; i++) captchaCode += chars[Math.floor(Math.random() * chars.length)];
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) {
    ctx.fillStyle = `rgba(${rand(180,255)},${rand(180,255)},${rand(180,255)},.9)`;
    ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2);
  }
  for (let i = 0; i < 4; i++) {
    ctx.strokeStyle = `rgba(${rand(100,200)},${rand(100,200)},${rand(100,200)},.5)`;
    ctx.beginPath();
    ctx.moveTo(Math.random() * W, Math.random() * H);
    ctx.lineTo(Math.random() * W, Math.random() * H);
    ctx.stroke();
  }
  const fonts = ['bold 24px Arial', 'bold 26px Georgia', 'bold 25px Verdana', 'italic bold 24px Courier New'];
  for (let i = 0; i < 4; i++) {
    ctx.save();
    ctx.font = fonts[i % fonts.length];
    ctx.fillStyle = `rgb(${rand(30,110)},${rand(30,110)},${rand(30,110)})`;
    ctx.translate(16 + i * 24, H / 2);
    ctx.rotate((Math.random() - .5) * .5);
    ctx.textBaseline = 'middle';
    ctx.fillText(captchaCode[i], 0, 0);
    ctx.restore();
  }
}
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
canvas.addEventListener('click', refreshCaptcha);

/* ================= 登录与退出 ================= */
const loginView = document.getElementById('loginView');
const appView = document.getElementById('appView');
const loginMsg = document.getElementById('loginMsg');
let currentUser = null;
let currentRole = null;

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg ' + type;
}

document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const captcha = document.getElementById('captcha').value.trim();

  if (!username) return showMsg(loginMsg, '请输入账号', 'error');
  if (!password) return showMsg(loginMsg, '请输入密码', 'error');
  if (!captcha) return showMsg(loginMsg, '请输入验证码', 'error');
  if (captcha.toUpperCase() !== captchaCode) {
    refreshCaptcha();
    document.getElementById('captcha').value = '';
    return showMsg(loginMsg, '验证码错误，请重新输入', 'error');
  }

  const users = loadUsers();
  const user = users.find(u => u.username === username);
  if (!user || user.password !== password) {
    refreshCaptcha();
    return showMsg(loginMsg, '账号或密码错误', 'error');
  }
  if (user.status !== 1) return showMsg(loginMsg, '该账号已被禁用，请联系管理员', 'error');

  const loginTime = fmtTime();
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username: user.username, loginTime }));
  enterApp(user, loginTime);
});

function enterApp(user, loginTime) {
  currentUser = user;
  const roles = loadRoles();
  currentRole = roles.find(r => r.id === user.role) || roles.find(r => r.id === 'user') || roles[0];

  loginView.style.display = 'none';
  appView.style.display = 'block';
  document.getElementById('password').value = '';
  document.getElementById('captcha').value = '';

  // 顶部信息
  document.getElementById('welcomeUser').textContent = `你好，${user.realname || user.username}`;
  document.getElementById('loginTime').textContent = `登录时间：${loginTime}`;

  // 首页信息
  document.getElementById('homeUsername').textContent = user.realname || user.username;
  document.getElementById('homeLoginTime').textContent = loginTime;
  document.getElementById('homeAccount').textContent = user.username;
  document.getElementById('homeRole').textContent = currentRole.name;
  document.getElementById('homeUserCount').textContent = loadUsers().length;
  document.getElementById('homeRoleCount').textContent = roles.length;

  applyPermissions();
  switchPage('home');
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  appView.style.display = 'none';
  loginView.style.display = 'block';
  showMsg(loginMsg, '已安全退出', 'success');
  refreshCaptcha();
  currentUser = null;
  currentRole = null;
}
document.getElementById('logoutBtn').addEventListener('click', logout);

/* ================= 权限控制 ================= */
function canView(pageId) {
  if (!currentRole) return false;
  return !!currentRole.permissions[pageId]?.view;
}
function canUse(pageId, buttonId) {
  if (!currentRole) return false;
  return !!currentRole.permissions[pageId]?.buttons[buttonId];
}

function applyPermissions() {
  document.querySelectorAll('.nav-item').forEach(item => {
    const page = item.dataset.page;
    item.style.display = canView(page) ? '' : 'none';
    if (!canView(page)) item.classList.remove('active');
  });
  document.getElementById('addUserBtn').style.display = canUse('userMgmt', 'addUser') ? '' : 'none';
  document.getElementById('addRoleBtn').style.display = canUse('roleMgmt', 'addRole') ? '' : 'none';
}

/* ================= 导航切换 ================= */
const pages = { home: '首页', userMgmt: '用户管理', roleMgmt: '权限配置' };
function switchPage(page) {
  if (!canView(page)) return;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  document.getElementById('homeView').classList.toggle('hidden', page !== 'home');
  document.getElementById('userMgmtView').classList.toggle('hidden', page !== 'userMgmt');
  document.getElementById('roleMgmtView').classList.toggle('hidden', page !== 'roleMgmt');
  document.getElementById('pageTitle').textContent = pages[page];
  if (page === 'userMgmt') renderUsers();
  if (page === 'roleMgmt') renderRoles();
}

document.getElementById('mainNav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (item) switchPage(item.dataset.page);
});

/* ================= 用户管理 ================= */
const tableBody = document.getElementById('userTableBody');
let editingUserIndex = -1;

function roleOptions() {
  const roles = loadRoles();
  document.getElementById('roleFilter').innerHTML = '<option value="">全部角色</option>' + roles.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('');
  document.getElementById('mRole').innerHTML = roles.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('');
}

function renderUsers() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const role = document.getElementById('roleFilter').value;
  const users = loadUsers().filter(u =>
    (!role || u.role === role) &&
    (!keyword || u.username.toLowerCase().includes(keyword) || (u.realname || '').toLowerCase().includes(keyword))
  );
  const roles = loadRoles();
  const roleMap = Object.fromEntries(roles.map(r => [r.id, r.name]));

  if (!users.length) {
    tableBody.innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
    return;
  }
  const canEdit = canUse('userMgmt', 'editUser');
  const canDel = canUse('userMgmt', 'deleteUser');
  tableBody.innerHTML = users.map(u => `
    <tr>
      <td>${esc(u.username)}</td>
      <td>${esc(u.realname || '-')}</td>
      <td><span class="role-tag ${u.role === 'admin' ? 'admin' : 'user'}">${esc(roleMap[u.role] || u.role)}</span></td>
      <td><span class="status-dot ${u.status === 1 ? 'on' : 'off'}"></span>${u.status === 1 ? '启用' : '禁用'}</td>
      <td>${esc(u.createTime || '-')}</td>
      <td>
        <button class="btn btn-ghost btn-sm" data-act="edit" data-name="${esc(u.username)}" ${canEdit ? '' : 'disabled'}>编辑</button>
        <button class="btn btn-danger btn-sm" data-act="del" data-name="${esc(u.username)}" ${canDel ? '' : 'disabled'}>删除</button>
      </td>
    </tr>`).join('');
}

function esc(s) { return String(s).replace(/[&<"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('searchInput').addEventListener('input', renderUsers);
document.getElementById('roleFilter').addEventListener('change', renderUsers);

tableBody.addEventListener('click', function (e) {
  const btn = e.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  const username = btn.dataset.name;
  const users = loadUsers();
  const index = users.findIndex(u => u.username === username);

  if (btn.dataset.act === 'edit') {
    openUserModal(index, users[index]);
  } else if (btn.dataset.act === 'del') {
    if (username === 'admin') return alert('内置管理员 admin 不可删除');
    if (confirm(`确定删除用户「${username}」吗？`)) {
      users.splice(index, 1);
      saveUsers(users);
      renderUsers();
      updateHomeStats();
    }
  }
});

/* ================= 用户弹窗 ================= */
const userModalMask = document.getElementById('userModalMask');
const userModalMsg = document.getElementById('userModalMsg');

function openUserModal(index, user) {
  if (!canUse('userMgmt', index === -1 ? 'addUser' : 'editUser')) return;
  editingUserIndex = index;
  roleOptions();
  document.getElementById('userModalTitle').textContent = index === -1 ? '新增用户' : '编辑用户';
  document.getElementById('mUsername').value = user ? user.username : '';
  document.getElementById('mUsername').disabled = !!user;
  document.getElementById('mPassword').value = user ? user.password : '';
  document.getElementById('mRealname').value = user ? (user.realname || '') : '';
  document.getElementById('mRole').value = user ? user.role : 'user';
  document.getElementById('mStatus').value = user ? user.status : 1;
  showMsg(userModalMsg, '', '');
  userModalMask.classList.add('show');
}
function closeUserModal() { userModalMask.classList.remove('show'); }

document.getElementById('addUserBtn').addEventListener('click', () => openUserModal(-1, null));
document.getElementById('userModalCancel').addEventListener('click', closeUserModal);
userModalMask.addEventListener('click', e => { if (e.target === userModalMask) closeUserModal(); });

document.getElementById('userModalConfirm').addEventListener('click', function () {
  const username = document.getElementById('mUsername').value.trim();
  const password = document.getElementById('mPassword').value;
  const realname = document.getElementById('mRealname').value.trim();
  const role = document.getElementById('mRole').value;
  const status = Number(document.getElementById('mStatus').value);

  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) return showMsg(userModalMsg, '账号需为 3-20 位字母、数字或下划线', 'error');
  if (password.length < 6 || password.length > 32) return showMsg(userModalMsg, '密码长度需为 6-32 位', 'error');

  const users = loadUsers();
  if (editingUserIndex === -1) {
    if (users.some(u => u.username === username)) return showMsg(userModalMsg, '该账号已存在', 'error');
    users.push({ username, password, realname, role, status, createTime: fmtTime() });
  } else {
    if (users[editingUserIndex].username === 'admin' && status !== 1) {
      return showMsg(userModalMsg, '内置管理员 admin 不能被禁用', 'error');
    }
    Object.assign(users[editingUserIndex], { password, realname, role, status });
  }
  saveUsers(users);
  closeUserModal();
  renderUsers();
  updateHomeStats();
});

/* ================= 权限配置 ================= */
const roleTableBody = document.getElementById('roleTableBody');
let editingRoleIndex = -1;

function renderRoles() {
  const keyword = document.getElementById('roleSearchInput').value.trim().toLowerCase();
  const roles = loadRoles().filter(r => !keyword || r.name.toLowerCase().includes(keyword));
  const canEdit = canUse('roleMgmt', 'editRole');
  const canDel = canUse('roleMgmt', 'deleteRole');

  roleTableBody.innerHTML = roles.map(r => {
    const cells = PAGE_DEFS.map(p => {
      const perm = r.permissions[p.id] || {};
      const view = perm.view ? '✅ 可访问' : '<span style="color:#ccc">—</span>';
      const btns = p.buttons.filter(b => perm.buttons?.[b.id]).map(b => b.name).join('、') || '—';
      return `<td>${view}<br><small style="color:var(--text-light)">${esc(btns)}</small></td>`;
    }).join('');
    return `<tr>
      <td><strong>${esc(r.name)}</strong>${r.builtIn ? '<span style="color:var(--text-light);font-size:12px;margin-left:6px">内置</span>' : ''}</td>
      ${cells}
      <td>
        <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${esc(r.id)}" ${canEdit ? '' : 'disabled'}>编辑</button>
        <button class="btn btn-danger btn-sm" data-act="del" data-id="${esc(r.id)}" ${(!r.builtIn && canDel) ? '' : 'disabled'}>删除</button>
      </td>
    </tr>`;
  }).join('');
}

document.getElementById('roleSearchInput').addEventListener('input', renderRoles);

roleTableBody.addEventListener('click', function (e) {
  const btn = e.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  const id = btn.dataset.id;
  const roles = loadRoles();
  const index = roles.findIndex(r => r.id === id);

  if (btn.dataset.act === 'edit') {
    openRoleModal(index, roles[index]);
  } else if (btn.dataset.act === 'del') {
    const users = loadUsers();
    if (users.some(u => u.role === id)) return alert('该角色下仍有用户，不可删除');
    if (confirm(`确定删除角色「${roles[index].name}」吗？`)) {
      roles.splice(index, 1);
      saveRoles(roles);
      renderRoles();
      updateHomeStats();
    }
  }
});

/* ================= 角色弹窗 ================= */
const roleModalMask = document.getElementById('roleModalMask');
const roleModalMsg = document.getElementById('roleModalMsg');

function buildPermEditor() {
  const container = document.getElementById('permContainer');
  container.innerHTML = '';
  PAGE_DEFS.forEach(p => {
    const section = document.createElement('div');
    section.className = 'perm-section';
    let html = `<h4>${esc(p.name)}</h4><div class="perm-row">`;
    html += `<label><input type="checkbox" class="perm-view" data-page="${esc(p.id)}"> 允许访问页面</label>`;
    p.buttons.forEach(b => {
      html += `<label><input type="checkbox" class="perm-btn" data-page="${esc(p.id)}" data-btn="${esc(b.id)}"> ${esc(b.name)}</label>`;
    });
    html += '</div>';
    section.innerHTML = html;
    container.appendChild(section);
  });

  container.querySelectorAll('.perm-view').forEach(cb => {
    cb.addEventListener('change', function () {
      const page = this.dataset.page;
      container.querySelectorAll(`.perm-btn[data-page="${page}"]`).forEach(b => b.disabled = !this.checked);
    });
  });
}

function openRoleModal(index, role) {
  if (!canUse('roleMgmt', index === -1 ? 'addRole' : 'editRole')) return;
  editingRoleIndex = index;
  document.getElementById('roleModalTitle').textContent = index === -1 ? '新增角色' : '编辑角色';
  document.getElementById('mRoleName').value = role ? role.name : '';
  showMsg(roleModalMsg, '', '');
  buildPermEditor();

  if (role) {
    PAGE_DEFS.forEach(p => {
      const perm = role.permissions[p.id] || {};
      const viewCb = document.querySelector(`.perm-view[data-page="${p.id}"]`);
      if (viewCb) {
        viewCb.checked = !!perm.view;
        document.querySelectorAll(`.perm-btn[data-page="${p.id}"]`).forEach(b => b.disabled = !perm.view);
      }
      p.buttons.forEach(b => {
        const btnCb = document.querySelector(`.perm-btn[data-page="${p.id}"][data-btn="${b.id}"]`);
        if (btnCb) btnCb.checked = !!perm.buttons?.[b.id];
      });
    });
  }
  roleModalMask.classList.add('show');
}
function closeRoleModal() { roleModalMask.classList.remove('show'); }

document.getElementById('addRoleBtn').addEventListener('click', () => openRoleModal(-1, null));
document.getElementById('roleModalCancel').addEventListener('click', closeRoleModal);
roleModalMask.addEventListener('click', e => { if (e.target === roleModalMask) closeRoleModal(); });

document.getElementById('roleModalConfirm').addEventListener('click', function () {
  const name = document.getElementById('mRoleName').value.trim();
  if (!name) return showMsg(roleModalMsg, '请输入角色名称', 'error');

  const roles = loadRoles();
  if (editingRoleIndex === -1) {
    if (roles.some(r => r.name === name)) return showMsg(roleModalMsg, '该角色名称已存在', 'error');
  } else {
    if (roles.some((r, i) => i !== editingRoleIndex && r.name === name)) return showMsg(roleModalMsg, '该角色名称已存在', 'error');
  }

  const permissions = {};
  PAGE_DEFS.forEach(p => {
    const view = document.querySelector(`.perm-view[data-page="${p.id}"]`).checked;
    const buttons = {};
    p.buttons.forEach(b => {
      const cb = document.querySelector(`.perm-btn[data-page="${p.id}"][data-btn="${b.id}"]`);
      buttons[b.id] = view && cb && cb.checked;
    });
    permissions[p.id] = { view, buttons };
  });

  if (editingRoleIndex === -1) {
    const id = 'role_' + Date.now();
    roles.push({ id, name, permissions, builtIn: false });
  } else {
    Object.assign(roles[editingRoleIndex], { name, permissions });
  }
  saveRoles(roles);
  closeRoleModal();
  renderRoles();
  roleOptions();
  updateHomeStats();
});

/* ================= 统计更新 ================= */
function updateHomeStats() {
  document.getElementById('homeUserCount').textContent = loadUsers().length;
  document.getElementById('homeRoleCount').textContent = loadRoles().length;
}

/* ================= 初始化 ================= */
refreshCaptcha();
const session = sessionStorage.getItem(SESSION_KEY);
if (session) {
  try {
    const { username, loginTime } = JSON.parse(session);
    const user = loadUsers().find(u => u.username === username);
    if (user && user.status === 1) enterApp(user, loginTime || fmtTime());
  } catch (e) {}
}
</script>
